[project]
name = "bia-hackaton-2026"
version = "0.1.0"
description = "Sahayi: a Malayalam-first Telegram assistant for seniors and people with disabilities"
readme = "README.md"
authors = [
    { name = "Ananthannn", email = "160157709+Ananthannn@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = [
    "chromadb>=1.5.9",
    "datasets>=5.1.0",
    "docx2txt>=0.9",
    "duckduckgo-search>=8.1.1",
    "evaluate>=0.4.6",
    "faiss-cpu>=1.15.1",
    "fastapi>=0.162.0",
    "google-genai>=3.0.0",
    "groq>=1.7.0",
    "langchain>=1.4.9",
    "langchain-community>=0.4.2",
    "langchain-core>=1.7.6",
    "langchain-openai>=1.7.4",
    "langgraph>=1.2.20",
    "langsmith>=0.14.17",
    "llama-index>=0.14.25",
    "llama-index-core>=0.14.25",
    "llama-index-embeddings-huggingface>=0.8.0",
    "llama-index-llms-openai>=0.7.10",
    "openai>=2.54.0",
    "openpyxl>=3.1.5",
    "pandas>=3.1.1",
    "pdfplumber>=0.11.10",
    "plotly>=7.1.0",
    "polars>=2.1.0",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.2",
    "pypdf>=7.0.0",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.33",
    "python-telegram-bot>=22.8",
    "ragas>=0.4.3",
    "rank-bm25>=0.2.2",
    "sarvamai>=0.1.44",
    "sentence-transformers>=6.2.0",
    "speechbrain>=1.1.2",
    "sse-starlette>=3.6.0",
    "streamlit>=1.67.0",
    "streamlit-shadcn-ui>=1.4.0",
    "tabulate>=0.10.0",
    "tavily-python>=0.8.5",
    "torch>=2.15.0",
    "torchaudio>=2.11.1",
    "torchvision>=0.29.2",
    "unstructured>=0.27.37",
    "uvicorn>=0.54.0",
    "websockets>=17.4",
]

[project.scripts]
bia-hackaton-2026 = "bia_hackaton_2026:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"
